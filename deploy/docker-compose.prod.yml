# Production stack: запускается deploy.sh из каталога, где лежат этот файл (как docker-compose.yml),
# .env и src/ с кодом приложения.
name: repair

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repair
      POSTGRES_USER: repair
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "repair", "-d", "repair"]
      interval: 2s
      retries: 15
    restart: unless-stopped
    # Порт не публикуется: БД доступна только контейнеру web.

  web:
    build: ./src
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DEBUG: "false"
      ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      SECURE_COOKIES: "true"
      DB_NAME: repair
      DB_USER: repair
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - media:/app/media
    # Только loopback: снаружи приложение доступно через Apache (deploy/apache-repair.conf).
    ports:
      - "127.0.0.1:${WEB_PORT:-8110}:8000"
    restart: unless-stopped

volumes:
  pgdata:
  media:
