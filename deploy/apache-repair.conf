# Apache reverse proxy для «Ремонтной мастерской».
# Установка (от root):
#   cp apache-repair.conf /etc/apache2/sites-available/zz-repair.conf
#   a2ensite zz-repair && apache2ctl configtest && systemctl reload apache2
#   certbot --apache -d repair.37.194.184.235.sslip.io
# certbot добавит HTTPS-хост (zz-repair-le-ssl.conf) и редирект HTTP -> HTTPS.
# Префикс "zz-" нужен, чтобы сайтом по умолчанию для *:443 оставался filebrowser.
<VirtualHost *:80>
    ServerName repair.37.194.184.235.sslip.io
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    # До 5 фото по 5 МБ плюс поля формы.
    LimitRequestBody 31457280
    ProxyPass / http://127.0.0.1:8110/
    ProxyPassReverse / http://127.0.0.1:8110/
    ErrorLog ${APACHE_LOG_DIR}/repair-error.log
    CustomLog ${APACHE_LOG_DIR}/repair-access.log combined
</VirtualHost>
