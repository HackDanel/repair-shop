{% extends 'base.html' %}
{% block title %}{% if obj %}{{ obj.name }}{% else %}Новая услуга{% endif %}{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>{% if obj %}Услуга: {{ obj.name }}{% else %}Новая услуга{% endif %}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form }}
    <button class="btn">Сохранить</button>
    <a class="btn btn--ghost" href="{% url 'dashboard:services' %}">Отмена</a>
  </form>
</div>
{% endblock %}
