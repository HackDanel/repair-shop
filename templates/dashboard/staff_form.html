{% extends 'base.html' %}
{% block title %}{% if obj %}{{ obj }}{% else %}Новый сотрудник{% endif %}{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>{% if obj %}Сотрудник: {{ obj }}{% else %}Новый сотрудник{% endif %}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form }}
    <button class="btn">Сохранить</button>
    <a class="btn btn--ghost" href="{% url 'dashboard:staff' %}">Отмена</a>
  </form>
</div>
{% endblock %}
